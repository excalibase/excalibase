# Stored project logs on a single host (EXC-672): the chart's Loki (EXC-634),
# fed by provisioning, which alone reaches it. Periods come from .env.
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
ingester:
  wal:
    dir: /loki/wal
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: ${LOG_RETENTION:-168h}
  # A project's lines carry its plan only while per-plan retention is on (EXC-659).
  retention_stream:
    - selector: '{tier="free"}'
      priority: 1
      period: ${LOG_RETENTION_FREE:-24h}
    - selector: '{tier="standard"}'
      priority: 1
      period: ${LOG_RETENTION_STANDARD:-168h}
    - selector: '{tier="enterprise"}'
      priority: 1
      period: ${LOG_RETENTION_ENTERPRISE:-168h}
  reject_old_samples: true
  reject_old_samples_max_age: ${LOG_RETENTION:-168h}
  # A small host: provisioning cuts lines at 16 KiB and stops a project at its daily budget.
  max_line_size: 16KB
  max_line_size_truncate: true
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 1MB
  per_stream_rate_limit_burst: 4MB
  # A deleted project's lines go through the delete API (EXC-678).
  deletion_mode: filter-and-delete
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
  # Lines stay queryable this long after a delete request; above the ingester's chunk age.
  delete_request_cancel_period: 24h
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16
analytics:
  reporting_enabled: false
