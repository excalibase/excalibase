# Test-only additions for boot-smoke.sh: images built from this checkout.
services:
  engine-proxy:
    image: docker.io/excalibase/provisioning:${PLATFORM_TAG:-${TAG:-latest}}
  provisioning:
    image: docker.io/excalibase/provisioning:${PLATFORM_TAG:-${TAG:-latest}}
    environment:
      APP_DISK_TOOLS_IMAGE: docker.io/excalibase/provisioning:${PLATFORM_TAG:-${TAG:-latest}}
      SITES_BUILD_EGRESS_IMAGE: docker.io/excalibase/provisioning:${PLATFORM_TAG:-${TAG:-latest}}
  studio:
    image: docker.io/excalibase/studio:${PLATFORM_TAG:-${TAG:-latest}}
  # GRAPHQL_IMAGE runs a locally built engine; unset keeps the bundle's release.
  graphql:
    image: ${GRAPHQL_IMAGE:-docker.io/excalibase/excalibase-graphql:${TAG:-1.5.0}}
