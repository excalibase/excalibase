apiVersion: v1
kind: Namespace
metadata:
  name: serverless
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deno-runtime
  namespace: serverless
  labels:
    app: deno-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deno-runtime
  template:
    metadata:
      labels:
        app: deno-runtime
    spec:
      containers:
      - name: runtime
        image: excalibase/deno-runtime:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: RUNTIME_SECRET
          valueFrom:
            secretKeyRef:
              name: deno-runtime-secret
              key: secret
        - name: ALLOWED_HOSTS
          value: "" # Restrict to project PG hosts only, e.g. "pg-rw.ns:5432"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: deno-runtime
  namespace: serverless
spec:
  selector:
    app: deno-runtime
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
---
# NetworkPolicy: only allow ingress from excalibase-server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deno-runtime-ingress
  namespace: serverless
spec:
  podSelector:
    matchLabels:
      app: deno-runtime
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app: excalibase-server
    ports:
    - port: 8000
      protocol: TCP
