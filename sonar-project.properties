# SonarCloud + local SonarQube configuration. Pinned to scanner CLI 8.x
# (sonarsource/sonar-scanner-cli:latest) for parity with SonarCloud's
# server-side engine. Local validation:
#
#   ./scripts/sonar-local.sh
#
# CI uses SonarSource/sonarqube-scan-action@v5 → see .github/workflows/ci.yml.

sonar.projectKey=excalibase_excalibase-provisioning
sonar.organization=excalibase
sonar.projectName=Excalibase Provisioning

# Source layout. Sources and tests share the same root dirs; the
# test.inclusions glob below tells Sonar which files are tests so
# the same path doesn't appear under both classifications.
sonar.sources=server-go,frontend/src,deno-server
sonar.tests=server-go,frontend/src,deno-server

sonar.test.inclusions=\
  **/*_test.go,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Per-language file suffix discrimination.
sonar.go.file.suffixes=.go

# Exclusions — cut everything that isn't first-party application code.
# `testdata/**` for Go fixtures, generated/build artifacts, vendored
# deps, lockfiles, and example k8s YAML in deno-server (kept for docs,
# not deployed by us).
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/playwright-report/**,\
  **/test-results/**,\
  **/.next/**,\
  **/vendor/**,\
  **/testdata/**,\
  **/*.lock,\
  **/*.lock.json,\
  charts/**,\
  scripts/**,\
  docs/**,\
  deno-server/k8s/**,\
  deno-server/example/**,\
  frontend/public/**

# Suppress S2187 ("Add some tests to this file or delete it") on Deno test
# files: Sonar's TS analyzer doesn't recognise Deno.test(), so it treats every
# *.test.ts under deno-server as a test-less file. They ARE tests — false positive.
sonar.issue.ignore.multicriteria=denoTests
sonar.issue.ignore.multicriteria.denoTests.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.denoTests.resourceKey=deno-server/test/**/*

# Coverage report — uploaded by the `go-integration` CI job (`coverage.out`,
# generated with -tags integration so it reflects the true total, not just unit).
sonar.go.coverage.reportPaths=server-go/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,deno-server/coverage/lcov.info

# Encoding (default UTF-8, but pinned for cross-platform consistency).
sonar.sourceEncoding=UTF-8
