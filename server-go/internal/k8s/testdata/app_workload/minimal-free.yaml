---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/managed-by: excalibase-provisioning
    app.kubernetes.io/name: web
    excalibase.io/app: app-01H
    excalibase.io/component: app
    excalibase.io/project: proj-abc
    excalibase.io/tier: free
  name: app-web
  namespace: org1-proj-abc
spec:
  minReadySeconds: 10
  replicas: 1
  selector:
    matchLabels:
      excalibase.io/app: app-01H
      excalibase.io/component: app
  strategy: {}
  template:
    metadata:
      annotations:
        excalibase.io/app-config-hash: e822dce99e47be55
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/managed-by: excalibase-provisioning
        app.kubernetes.io/name: web
        excalibase.io/app: app-01H
        excalibase.io/component: app
        excalibase.io/project: proj-abc
        excalibase.io/tier: free
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/acme/web:1.4.2
        imagePullPolicy: Always
        name: web
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          tcpSocket:
            port: 8080
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
            - SETUID
            - SETGID
            - SETPCAP
            - SETFCAP
            - KILL
            - NET_BIND_SERVICE
            - SYS_CHROOT
            - MKNOD
            - AUDIT_WRITE
            drop:
            - ALL
          readOnlyRootFilesystem: false
      runtimeClassName: gvisor
      securityContext:
        seccompProfile:
          type: RuntimeDefault
status: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/managed-by: excalibase-provisioning
    app.kubernetes.io/name: web
    excalibase.io/app: app-01H
    excalibase.io/component: app
    excalibase.io/project: proj-abc
    excalibase.io/tier: free
  name: app-web-egress
  namespace: org1-proj-abc
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  podSelector:
    matchLabels:
      excalibase.io/app: app-01H
      excalibase.io/component: app
  policyTypes:
  - Egress
