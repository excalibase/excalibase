---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/managed-by: excalibase-provisioning
    app.kubernetes.io/name: web
    excalibase.io/app: app-01H
    excalibase.io/component: app
    excalibase.io/project: proj-abc
    excalibase.io/tier: enterprise
  name: app-web
  namespace: org1-proj-abc
spec:
  replicas: 2
  selector:
    matchLabels:
      excalibase.io/app: app-01H
      excalibase.io/component: app
  strategy: {}
  template:
    metadata:
      annotations:
        excalibase.io/app-config-hash: 408d823597ce3a92
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/managed-by: excalibase-provisioning
        app.kubernetes.io/name: web
        excalibase.io/app: app-01H
        excalibase.io/component: app
        excalibase.io/project: proj-abc
        excalibase.io/tier: enterprise
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/acme/web:1.4.2
        imagePullPolicy: Always
        name: web
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "1"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
status: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/managed-by: excalibase-provisioning
    app.kubernetes.io/name: web
    excalibase.io/app: app-01H
    excalibase.io/component: app
    excalibase.io/project: proj-abc
    excalibase.io/tier: enterprise
  name: app-web-egress
  namespace: org1-proj-abc
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  podSelector:
    matchLabels:
      excalibase.io/app: app-01H
      excalibase.io/component: app
  policyTypes:
  - Egress
