---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/managed-by: excalibase-provisioning
    app.kubernetes.io/name: web
    excalibase.io/app: app-01H
    excalibase.io/component: app
    excalibase.io/project: proj-abc
    excalibase.io/tier: enterprise
  name: app-web
  namespace: org1-proj-abc
spec:
  minReadySeconds: 10
  replicas: 2
  selector:
    matchLabels:
      excalibase.io/app: app-01H
      excalibase.io/component: app
  strategy: {}
  template:
    metadata:
      annotations:
        excalibase.io/app-config-hash: bf78579bee9b2b6b
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/managed-by: excalibase-provisioning
        app.kubernetes.io/name: web
        excalibase.io/app: app-01H
        excalibase.io/component: app
        excalibase.io/project: proj-abc
        excalibase.io/tier: enterprise
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/acme/web:1.4.2
        imagePullPolicy: Always
        name: web
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 10
          tcpSocket:
            port: 8080
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "1"
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
            - SETUID
            - SETGID
            - SETPCAP
            - SETFCAP
            - KILL
            - NET_BIND_SERVICE
            - SYS_CHROOT
            - MKNOD
            - AUDIT_WRITE
            drop:
            - ALL
          readOnlyRootFilesystem: false
      runtimeClassName: gvisor
      securityContext:
        seccompProfile:
          type: RuntimeDefault
status: {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/managed-by: excalibase-provisioning
    app.kubernetes.io/name: web
    excalibase.io/app: app-01H
    excalibase.io/component: app
    excalibase.io/project: proj-abc
    excalibase.io/tier: enterprise
  name: app-web-egress
  namespace: org1-proj-abc
spec:
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEntities:
    - world
  egressDeny:
  - toCIDRSet:
    - cidr: 169.254.0.0/16
    - cidr: 10.0.0.0/8
    - cidr: 172.16.0.0/12
    - cidr: 192.168.0.0/16
    - cidr: 100.64.0.0/10
    - cidr: 127.0.0.0/8
    - cidr: 0.0.0.0/8
    - cidr: 224.0.0.0/4
    - cidr: 240.0.0.0/4
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "25"
        protocol: TCP
  endpointSelector:
    matchLabels:
      excalibase.io/app: app-01H
      excalibase.io/component: app
