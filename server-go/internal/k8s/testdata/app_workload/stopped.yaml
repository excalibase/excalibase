---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/managed-by: excalibase-provisioning
    app.kubernetes.io/name: web
    excalibase.io/app: app-01H
    excalibase.io/component: app
    excalibase.io/project: proj-abc
    excalibase.io/tier: standard
  name: app-web
  namespace: org1-proj-abc
spec:
  minReadySeconds: 10
  replicas: 0
  selector:
    matchLabels:
      excalibase.io/app: app-01H
      excalibase.io/component: app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        excalibase.io/app-config-hash: 5b82bef8943eb1aa
        excalibase.io/app-env-revision: "7"
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/managed-by: excalibase-provisioning
        app.kubernetes.io/name: web
        excalibase.io/app: app-01H
        excalibase.io/component: app
        excalibase.io/project: proj-abc
        excalibase.io/tier: standard
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: LOG_LEVEL
          value: debug
        - name: EMPTY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: app-web-env
        - name: PGHOST
          value: proj-abc-postgres-rw.org1-proj-abc.svc.cluster.local
        - name: STRIPE_KEY
          valueFrom:
            secretKeyRef:
              key: STRIPE_KEY
              name: app-web-env
        image: ghcr.io/acme/web:1.4.2
        imagePullPolicy: Always
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        name: web
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
            - SETUID
            - SETGID
            - SETPCAP
            - SETFCAP
            - KILL
            - NET_BIND_SERVICE
            - SYS_CHROOT
            - MKNOD
            - AUDIT_WRITE
            drop:
            - ALL
          readOnlyRootFilesystem: false
      runtimeClassName: gvisor
      securityContext:
        seccompProfile:
          type: RuntimeDefault
status: {}
