# The chart's Loki config (excalibase-service charts/platform-aio/templates/_logs.tpl,
# EXC-634 + EXC-678) with the compactor's timers shortened, so a test sees a
# deletion through within minutes instead of a day.
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /var/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
ingester:
  wal:
    dir: /var/loki/wal
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  deletion_mode: filter-and-delete
compactor:
  working_directory: /var/loki/compactor
  compaction_interval: 15s
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
  delete_request_cancel_period: 20s
analytics:
  reporting_enabled: false
