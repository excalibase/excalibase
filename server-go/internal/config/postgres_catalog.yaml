# The catalogue of PostgreSQL majors this platform will provision.
#
# This file is the source of truth. Three things read it:
#   * provisioning, which refuses any request naming a major that is not here;
#   * the image build workflow (.github/workflows/postgres-image-publish.yml),
#     which builds one image per entry from its baseImage;
#   * `go run ./cmd/pgcatalog`, which renders the CNPG ClusterImageCatalog the
#     clusters are pinned through, so that object cannot drift from this file.
#
# PostgreSQL 18 is deliberately absent. It is too new to put under a tenant's
# data; adding it is a decision, not a version bump, and until it is made a
# request naming 18 is refused exactly like a request naming 13.
#
# baseImage and image are both pinned by digest. A floating tag would let the
# bits under a provisioned cluster change without anything in the platform
# recording that it happened.
#
# The digests below were pushed to Docker Hub by run 35622826849 and each one
# was confirmed to pull anonymously. Images used to go to GHCR, which the
# platform does not pull from, so every tenant pod met ImagePullBackOff
# (EXC-430); a digest names bits in a registry, which is why the old GHCR ones
# were not carried across.
#
# An entry with no `image` has not been published yet. That is a real state,
# not a default: provisioning refuses the major with an explicit error rather
# than falling back to a tag or to another major. Publishing fills it in — the
# workflow prints the digest it pushed and fails if it is not the one recorded
# here, so the file cannot quietly fall behind the registry.
#
# documentdb records whether the image for that major carries the DocumentDB
# extension, and every `true` here was proven, not assumed: the image was
# built, started, and made to create a collection, insert a document and read
# it back (TestDocumentDBWorksOnEveryMajorThatClaimsIt).
#
# We compile DocumentDB from source rather than install upstream's .debs —
# upstream publishes deb12 packages only for the majors Microsoft chose to
# package, and that is their packaging decision, not a limit of the extension.
# Compiling lets 15 and 16 carry it too.
#
# 14 cannot. The extension calls MarkGUCPrefixReserved(), which PostgreSQL only
# grew in 15, so pg_documentdb_core.c does not compile against the 14 headers:
#
#   src/pg_documentdb_core.c:61:9: error: implicit declaration of function
#   'MarkGUCPrefixReserved' [-Werror=implicit-function-declaration]
#
# Making 14 work would mean carrying a patch against upstream, which we do not
# do. 14 stays DocumentDB-less and provisioning refuses the combination.
#
# documentDBRef is the upstream git tag we compile. Because we own this choice
# now, moving it is deliberate: a new tag changes the extension version every
# DocumentDB project runs, so it is bumped with a rebuild and a re-proof, not
# picked up automatically. v0.117-0 is the newest release at the time of
# writing and installs extension version 0.117-0.
documentDBRef: "v0.117-0"
# The gateway that speaks the MongoDB wire protocol in front of the extension.
# It is not ours and we do not build it: upstream publishes it from the
# DocumentDB Kubernetes operator repository, and the CNPG-I sidecar injector
# puts it in the Postgres pod of a project that asked for DocumentDB.
#
# It must name the same release as documentDBRef above. The gateway calls the
# extension's own SQL API and the two are not supported apart, so moving one
# without the other is a combination nobody has run — the tag is written in
# the comment beside the digest so the pair can be read at a glance.
#
# Pinned by digest for the same reason every other image here is: a tag would
# let the bits inside a tenant's database pod change with nothing recording
# that they had.
# ghcr.io/documentdb/documentdb-kubernetes-operator/gateway:0.117.0
documentDBGatewayImage: ghcr.io/documentdb/documentdb-kubernetes-operator/gateway@sha256:8a5c7e533dc0fbed8ed780b22e31001a6b12ae0eb670f4aac62c1ded782742ed
documentDBGatewayImageTag: "0.117.0"
majors:
  - major: "14"
    baseImage: ghcr.io/cloudnative-pg/postgresql@sha256:5e16b178b239f3e6854ae86ce9190b151c0aa30f7f99014659ba24e1a6885084
    image: excalibase/postgresql@sha256:09178c11b8ad8cf4e4eb4011d1475459a6d472fb3163c5ed8ac7debc71f5745b
    documentdb: false
  - major: "15"
    baseImage: ghcr.io/cloudnative-pg/postgresql@sha256:6cca69b026405a5cc8593b6bf2a095010fad51ba338a368a3b5305c1c2c77cf6
    image: excalibase/postgresql@sha256:36f03348d67fddc50692e8bb308a4572eafca62bd90bfaeab60bc1e8c4549ed1
    documentdb: true
  - major: "16"
    baseImage: ghcr.io/cloudnative-pg/postgresql@sha256:da9f3d23790ccd052fb4f9620ab0c71eb1c3896c3a1189381c47e8b5f681768d
    image: excalibase/postgresql@sha256:dcac3cad1a0950104f6cad9bcba2a55b135c4511b9329ab1b880096d8b9211fa
    documentdb: true
  - major: "17"
    baseImage: ghcr.io/cloudnative-pg/postgresql@sha256:9f9286957d1030e0b5964804b557c635603a296d26c6212372f9d416ebb6f168
