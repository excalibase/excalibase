# Meilisearch 1.56 (Community Edition) as a public search API behind its master key.
format: excalibase.template/v1
id: meilisearch
name: Meilisearch
category: search
license: MIT (Community Edition)
summary: A search API on its own URL, protected by a generated master key.
description: >-
  One public app named meilisearch on its own URL (port 7700). Every request
  needs a key: the master key is generated when you deploy and shown to you
  once; use it to create search-only keys for your front end. Indexes are kept
  on a 1Gi disk. Analytics are off. You run this service: Excalibase does not
  back it up, upgrade it or watch it; use Meilisearch dumps for backups. Image
  getmeili/meilisearch v1.56.0, pinned by digest.
apps:
  - name: meilisearch
    image: getmeili/meilisearch@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
    port: 7700
    healthCheckPath: /health
    replicas: 1
    disk:
      mountPath: /meili_data
      size: 1Gi
    env:
      - name: MEILI_MASTER_KEY
        value: "${{ secret(32) }}"
        showOnce: true
      - name: MEILI_ENV
        value: production
      - name: MEILI_NO_ANALYTICS
        value: "true"
