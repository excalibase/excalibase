apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning
  namespace: {{ .Values.namespace }}
  labels:
    app: provisioning
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: provisioning
  template:
    metadata:
      labels:
        app: provisioning
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: provisioning
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
            - containerPort: {{ .Values.service.publicPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.netmeter.enabled }}
            - name: FEATURE_NETMETER
              value: "true"
            - name: NETMETER_KUBELET_CA_FILE
              value: /etc/excalibase/kubelet-ca/ca.crt
            - name: NETMETER_KUBELET_PORT
              value: {{ .Values.netmeter.kubeletPort | quote }}
            {{- end }}
            # Who provisioning binds to its tenant role in each project namespace it creates.
            - name: PROJECT_NAMESPACE_ROLE
              value: excalibase-provisioning-project
            - name: PROVISIONING_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PUBLIC_PORT
              value: {{ .Values.service.publicPort | quote }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ required "trustedProxyCIDRs is required: the ingress controller's pod CIDR, the only peers whose X-Forwarded-For is believed" .Values.trustedProxyCIDRs | quote }}
            {{- if and (eq (toString (default "" .Values.env.DEPLOYMENT_MODE)) "cloud") .Values.adminConsole.host (not (and .Values.adminAccess.teamDomain .Values.adminAccess.audience)) }}
            {{- fail "a cloud install with adminConsole.host needs adminAccess.teamDomain and adminAccess.audience: the provisioning server refuses to start with an admin host that is not behind Access" }}
            {{- end }}
            {{- if .Values.adminConsole.host }}
            - name: ADMIN_HOST
              value: {{ .Values.adminConsole.host | quote }}
            {{- end }}
            {{- if or .Values.adminAccess.teamDomain .Values.adminAccess.audience }}
            - name: ADMIN_ACCESS_TEAM_DOMAIN
              value: {{ required "adminAccess.teamDomain and adminAccess.audience must be set together" .Values.adminAccess.teamDomain | quote }}
            - name: ADMIN_ACCESS_AUD
              value: {{ required "adminAccess.teamDomain and adminAccess.audience must be set together" .Values.adminAccess.audience | quote }}
            {{- if not .Values.adminConsole.host }}
            {{- fail "adminAccess needs adminConsole.host: there is no admin host to put behind Access" }}
            {{- end }}
            {{- end }}
            - name: STUDIO_URL
              value: {{ required "studioUrl is required: the Studio origin emailed links open, e.g. https://studio.example.com" .Values.studioUrl | quote }}
            - name: SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "setupToken.existingSecret is required: a Secret holding the one-time first-admin token (openssl rand -hex 32); provisioning refuses to start without it" .Values.setupToken.existingSecret }}
                  key: {{ .Values.setupToken.existingSecretKey | default "token" }}
            - name: STORAGE_PATH
              value: /data
            - name: DB_PATH
              value: /data/excalibase.db
            {{- if and .Values.platformDB .Values.platformDB.enabled }}
            {{- if .Values.platformDB.existingSecret }}
            - name: PLATFORM_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformDB.existingSecret }}
                  key: {{ .Values.platformDB.existingSecretKey | default "PLATFORM_DB_URL" }}
            {{- else if .Values.platformDB.url }}
            - name: PLATFORM_DB_URL
              value: {{ .Values.platformDB.url | quote }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.netmeter.enabled }}
            - name: kubelet-ca
              mountPath: /etc/excalibase/kubelet-ca
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: provisioning-data
        - name: tmp
          emptyDir: {}
        {{- if .Values.netmeter.enabled }}
        - name: kubelet-ca
          configMap:
            name: {{ .Values.netmeter.kubeletCAConfigMap }}
            # Missing, the pod still starts and the meter says why and stays off.
            optional: true
        {{- end }}
