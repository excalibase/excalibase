apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provisioning
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: provisioning
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only allow traffic from within the platform namespace
    - from:
        - namespaceSelector:
            matchLabels:
              excalibase.io/type: platform
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
        - protocol: TCP
          port: {{ .Values.service.publicPort }}
  egress:
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server (for client-go operations)
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    {{- if .Values.netmeter.enabled }}
    # Per-app network metering reads each node's kubelet (EXC-844). On Cilium
    # the node is not matched by an address, so netmeter-cilium-policy.yaml
    # names it by entity as well.
    - to: []
      ports:
        - protocol: TCP
          port: {{ .Values.netmeter.kubeletPort }}
    {{- end }}
    # The platform store (platform-db) in the platform namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              excalibase.io/type: platform
      ports:
        - protocol: TCP
          port: 5432
    # Project namespace PostgreSQL (for pod exec role creation)
    - to:
        - namespaceSelector:
            matchLabels:
              excalibase.io/type: project
      ports:
        - protocol: TCP
          port: 5432
