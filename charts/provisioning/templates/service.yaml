apiVersion: v1
kind: Service
metadata:
  name: provisioning
  namespace: {{ .Values.namespace }}
  labels:
    app: provisioning
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
    - name: public
      port: {{ .Values.service.publicPort }}
      targetPort: {{ .Values.service.publicPort }}
      protocol: TCP
  selector:
    app: provisioning
