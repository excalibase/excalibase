replicaCount: 1

image:
  repository: excalibase/provisioning
  tag: "0.1.0"
  pullPolicy: IfNotPresent

namespace: excalibase-platform

service:
  # In-cluster callers; X-Forwarded-For is ignored here.
  port: 24005
  # The ingress only: X-Forwarded-For is believed from trustedProxyCIDRs.
  publicPort: 24006

ingress:
  enabled: true
  className: nginx
  host: api.excalibase.io
  paths:
    - /api/provision
    - /api/vault
    - /api/schema
    - /api/auth
    - /api/setup
    - /api/alerts
    - /api/parameter-groups
    - /api/functions
  tls:
    enabled: true
    secretName: provisioning-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

storage:
  size: 5Gi
  storageClass: ""

# Required. The Studio origin that emailed verification and password-reset
# links open, e.g. https://studio.example.com. No default.
studioUrl: ""

# Required. The ingress controller's pod CIDR(s), the only peers whose
# X-Forwarded-For the public listener believes. No default.
trustedProxyCIDRs: ""

# Required. The Secret holding the one-time first-admin setup token (EXC-451),
# at least 32 characters, e.g.
#   kubectl create secret generic first-admin-token --from-literal=token="$(openssl rand -hex 32)"
# Register the first admin with it; provisioning refuses to start without it.
setupToken:
  existingSecret: ""
  existingSecretKey: "token"

env:
  PORT: "24005"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://app.excalibase.io"
  WATCHER_CHART_PATH: "/charts/excalibase-watcher"
  # StorageClass a project's database runs on when its request names none;
  # empty = the cluster's default StorageClass.
  TENANT_STORAGE_CLASS: ""
  # Comma-separated further classes a create request may name; empty = only the default.
  TENANT_STORAGE_CLASSES: ""

platformDB:
  enabled: true
  # Connection string for the CNPG platform-db cluster
  # Format: postgres://platform:password@platform-db-rw.excalibase-platform:5432/platform?sslmode=require
  url: ""
  # If using a secret for the DB URL (recommended for production)
  existingSecret: ""
  existingSecretKey: "PLATFORM_DB_URL"

serviceAccount:
  name: provisioning-sa

pdb:
  enabled: true
  minAvailable: 1
