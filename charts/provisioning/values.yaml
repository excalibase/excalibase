replicaCount: 1

image:
  repository: excalibase/provisioning
  tag: "0.1.0"
  pullPolicy: IfNotPresent

namespace: excalibase-platform

service:
  port: 24005

ingress:
  enabled: true
  className: nginx
  host: api.excalibase.io
  paths:
    - /api/provision
    - /api/vault
    - /api/schema
    - /api/auth
    - /api/setup
    - /api/alerts
    - /api/parameter-groups
    - /api/functions
  tls:
    enabled: true
    secretName: provisioning-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

storage:
  size: 5Gi
  storageClass: ""

env:
  PORT: "24005"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://app.excalibase.io"
  WATCHER_CHART_PATH: "/charts/excalibase-watcher"

serviceAccount:
  name: provisioning-sa

pdb:
  enabled: true
  minAvailable: 1
