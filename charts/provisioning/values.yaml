# MCP confirmation tokens (server-go/internal/mcpserver/confirm.go) are held in this
# process: more than one replica needs a shared store first, or a token issued by
# one replica is unknown to the next.
replicaCount: 1

image:
  repository: excalibase/provisioning
  tag: "0.1.0"
  pullPolicy: IfNotPresent

namespace: excalibase-platform

service:
  # In-cluster callers; X-Forwarded-For is ignored here.
  port: 24005
  # The ingress only: X-Forwarded-For is believed from trustedProxyCIDRs.
  publicPort: 24006

ingress:
  enabled: true
  className: nginx
  host: api.excalibase.io
  paths:
    - /api/provision
    - /api/vault
    - /api/schema
    - /api/auth
    - /api/setup
    - /api/alerts
    - /api/parameter-groups
    - /api/functions
    - /mcp
  tls:
    enabled: true
    secretName: provisioning-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "10"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

storage:
  size: 5Gi
  storageClass: ""

# Required. The Studio origin that emailed verification and password-reset
# links open, e.g. https://studio.example.com. No default.
studioUrl: ""

# Required. The ingress controller's pod CIDR(s), the only peers whose
# X-Forwarded-For the public listener believes. No default.
trustedProxyCIDRs: ""

# Required. The Secret holding the one-time first-admin setup token (EXC-451),
# at least 32 characters, e.g.
#   kubectl create secret generic first-admin-token --from-literal=token="$(openssl rand -hex 32)"
# Register the first admin with it; provisioning refuses to start without it.
setupToken:
  existingSecret: ""
  existingSecretKey: "token"

# The operator console (EXC-757), off by default. Set host to serve it at its
# own hostname: /api/admin answers there and nowhere else. The admin host
# should sit behind Cloudflare Access (proxied DNS); the origin then demands the
# Access assertion on every request to it, because anyone can send a forged
# Host header straight to the origin.
#
# Prod needs a TLS certificate for the admin host at the origin, with
# Cloudflare's SSL mode on Full (strict). The defaults below match the prod
# edge: HAProxy, and the certificate secret (managed by a standalone Certificate)
# already issued for admin.excalibase.io.
adminConsole:
  host: ""
  ingress:
    enabled: true
    className: haproxy
    # The Studio frontend Service the admin host serves at /.
    studioService:
      name: studio
      port: 80
    tls:
      enabled: true
      secretName: admin-excalibase-io-tls
    # No issuer annotation on purpose: a standalone Certificate already manages
    # the secret, and cert-manager must not create a second one for it.
    annotations: {}

# Cloudflare Access in front of the admin host. Both are required together and
# need adminConsole.host: <team>.cloudflareaccess.com, and the application's AUD tag.
adminAccess:
  teamDomain: ""
  audience: ""

env:
  PORT: "24005"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://app.excalibase.io"
  WATCHER_CHART_PATH: "/charts/excalibase-watcher"
  # StorageClass a project's database runs on when its request names none;
  # empty = the cluster's default StorageClass.
  TENANT_STORAGE_CLASS: ""
  # Comma-separated further classes a create request may name; empty = only the default.
  TENANT_STORAGE_CLASSES: ""
  # Credit ledger, the sign-up credit and admin grants (EXC-866); off until "true".
  # CREDITS_TRIAL_DOLLARS, CREDITS_TRIAL_DAYS, CREDITS_TRIAL_CAP, CREDITS_ADMIN_GRANT_CAP_DOLLARS,
  # CREDITS_TERMS_VERSION and CREDITS_TERMS_URL set its numbers; the defaults are 300, 90, 40, 1000, v1.
  FEATURE_CREDITS: "false"
  FEATURE_PLANBUDGET: "false"
  # Usage metering (EXC-866): samples what each org reserves and draws settled hours from its credit.
  # Needs FEATURE_CREDITS and FEATURE_PLANBUDGET, or the server refuses to start. Prices and free
  # allowances: CREDIT_PRICES (JSON) and CREDIT_ALLOWANCE_{FREE,STANDARD}_{CPU_MILLI,MEMORY_MIB,DISK_GIB}.
  FEATURE_CREDITBURN: "false"

platformDB:
  enabled: true
  # Connection string for the CNPG platform-db cluster
  # Format: postgres://platform:password@platform-db-rw.excalibase-platform:5432/platform?sslmode=require
  url: ""
  # If using a secret for the DB URL (recommended for production)
  existingSecret: ""
  existingSecretKey: "PLATFORM_DB_URL"

serviceAccount:
  name: provisioning-sa

pdb:
  enabled: true
  minAvailable: 1

# Per-app network metering (EXC-844): provisioning reads each node's kubelet
# summary (GET https://<node>:10250/stats/summary) with its service account.
# Off by default. On: the role may get nodes/stats and read nodes, the pod
# mounts the CA that signed the kubelet's serving certificate from the
# ConfigMap below (never a hostPath; the pod starts without it and the meter
# stays off), and the pod's egress policy lets it reach the kubelet port.
# kube-root-ca.crt is the cluster CA Kubernetes publishes to every namespace;
# on RKE2 and k3s it is the one that signs the kubelet. Name another ConfigMap
# holding ca.crt where it is not (kind and kubeadm self-sign the kubelet).
# The setup status reads the CloudNativePG operator's Deployment. The namespace
# must exist when the chart is installed; turn this off only if the operator is
# not used.
operatorCheck:
  enabled: true
  namespace: cnpg-system

netmeter:
  enabled: false
  kubeletCAConfigMap: kube-root-ca.crt
  kubeletPort: 10250
