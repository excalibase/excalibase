platformDB:
  instances: 3
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "16.4"
    # Required: the bits under the platform database change only when this does.
    digest: "sha256:99be063781d171d3971089b49c992706bdab9ccbd2b57cdf126c7542773aedfe"
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: ""
  monitoring:
    enabled: true
  backup:
    # Goes through the Barman Cloud plugin, which must be installed first.
    # Platform-DB → object storage, on a bucket and key used by nothing else.
    # Tenant namespaces hold a copy of the tenant key (r2-creds, copied as
    # backup-s3-creds), so sharing it would hand any tenant every user's
    # password hash and the vault. The chart refuses either name.
    enabled: true
    destinationPath: "s3://excalibase-platform-db-backups/"
    endpointURL: ""               # required; e.g. --set platformDB.backup.endpointURL=https://<account>.r2.cloudflarestorage.com
    retentionPolicy: "30d"
    # CloudNativePG cron: six fields, seconds first.
    schedule: "0 0 3 * * *"
    s3Secret: platform-db-backup-creds
    s3AccessKeyIDKey: ACCESS_KEY_ID
    s3SecretAccessKeyKey: ACCESS_SECRET_KEY
    # Inline creds create s3Secret; left empty, s3Secret must already exist
    # in the namespace.
    s3AccessKeyID: ""
    s3SecretAccessKey: ""
