apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-db
  namespace: excalibase-platform
  labels:
    app.kubernetes.io/name: platform-db
    app.kubernetes.io/part-of: excalibase-platform
spec:
  instances: {{ .Values.platformDB.instances }}

  imageName: "{{ .Values.platformDB.image.repository }}:{{ .Values.platformDB.image.tag }}@{{ required "platformDB.image.digest is required" .Values.platformDB.image.digest }}"

  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      max_connections: "200"

  resources:
    requests:
      cpu: {{ .Values.platformDB.resources.requests.cpu | quote }}
      memory: {{ .Values.platformDB.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.platformDB.resources.limits.cpu | quote }}
      memory: {{ .Values.platformDB.resources.limits.memory | quote }}

  storage:
    size: {{ .Values.platformDB.storage.size }}
    {{- if .Values.platformDB.storage.storageClass }}
    storageClass: {{ .Values.platformDB.storage.storageClass }}
    {{- end }}

  bootstrap:
    initdb:
      database: platform
      owner: platform

  {{- if .Values.platformDB.monitoring.enabled }}
  monitoring:
    enablePodMonitor: true
  {{- end }}

  {{- if .Values.platformDB.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: platform-db-backups
  {{- end }}
