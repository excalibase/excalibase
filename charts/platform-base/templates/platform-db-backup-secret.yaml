{{- /*
Only create a separate secret when inline creds are supplied. Default
deployment reuses the existing `r2-creds` secret (managed out-of-band
by the operator), in which case s3AccessKeyID / s3SecretAccessKey are
empty and this template is a no-op — the cluster spec just references
the pre-existing secret by name.
*/ -}}
{{- if and .Values.platformDB.backup.enabled .Values.platformDB.backup.s3AccessKeyID .Values.platformDB.backup.s3SecretAccessKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.platformDB.backup.s3Secret }}
  namespace: excalibase-platform
  labels:
    app.kubernetes.io/name: platform-db
    app.kubernetes.io/part-of: excalibase-platform
type: Opaque
data:
  {{ .Values.platformDB.backup.s3AccessKeyIDKey | default "ACCESS_KEY_ID" }}: {{ .Values.platformDB.backup.s3AccessKeyID | b64enc }}
  {{ .Values.platformDB.backup.s3SecretAccessKeyKey | default "ACCESS_SECRET_KEY" }}: {{ .Values.platformDB.backup.s3SecretAccessKey | b64enc }}
{{- end }}
