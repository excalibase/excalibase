name: Trivy image gate
description: >
  Pinned Trivy (checksum-verified) on an image: fails on a CRITICAL
  vulnerability that has a fix, unless .trivyignore.yaml lists it with a
  statement; HIGH is reported in the job summary only (EXC-642).
inputs:
  image:
    description: Image reference to scan (local daemon first, then the registry)
    required: true
  fail:
    description: "'true' fails the step on a fixable CRITICAL; 'false' only reports"
    default: "true"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-trivy

    # Counts only: the public log and step summary never carry a vulnerability table.
    - name: Fixable CRITICAL fails
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        FAIL: ${{ inputs.fail }}
      run: |
        ignore=()
        [ -f .trivyignore.yaml ] && ignore=(--ignorefile .trivyignore.yaml)
        report="$RUNNER_TEMP/trivy-gate.json"
        trivy image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed --format json \
          --output "$report" "${ignore[@]}" "$IMAGE"
        blocked=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$report")
        echo "fixable Critical: $blocked"
        if [ "$FAIL" = true ] && [ "$blocked" -gt 0 ]; then
          echo "::error::blocked: $blocked fixable Critical"
          exit 1
        fi

    - name: HIGH and CRITICAL counts
      if: always()
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        report="$RUNNER_TEMP/trivy-counts.json"
        if trivy image --quiet --skip-db-update --skip-java-db-update --scanners vuln --severity HIGH,CRITICAL \
             --format json --output "$report" "$IMAGE" 2>/dev/null; then
          jq -r '"### Trivy: \([.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length) Critical, \([.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length) High (counts only)"' "$report" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### Trivy counts: scan failed" >> "$GITHUB_STEP_SUMMARY"
        fi
