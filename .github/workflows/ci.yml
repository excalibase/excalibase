name: CI

# release/** runs the same suites as main: a patch is cut on release/<major>.<minor>
# and CD (cd.yml) builds and publishes release-<major>.<minor>-<sha> from the
# commit this run passes on.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, "release/**"]

# A new push to a pull request cancels the older run of that PR (a run uses ~15
# runner slots). Push runs on main/develop/release are keyed by run id, so each is
# unique and never cancelled: cd.yml reads each push run's result.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deno: ${{ steps.filter.outputs.deno }}
      ci: ${{ steps.filter.outputs.ci }}
      hosting: ${{ steps.filter.outputs.hosting }}
      mysqlbackup: ${{ steps.filter.outputs.mysqlbackup }}
      failedprovisioning: ${{ steps.filter.outputs.failedprovisioning }}
      singlehost: ${{ steps.filter.outputs.singlehost }}
      singlehostboot: ${{ steps.filter.outputs.singlehostboot }}
      gatewayguard: ${{ steps.filter.outputs.gatewayguard }}
      sitesrouter: ${{ steps.filter.outputs.sitesrouter }}
      sitesoutbound: ${{ steps.filter.outputs.sitesoutbound }}
      sitebuilds: ${{ steps.filter.outputs.sitebuilds }}
      appbuilds: ${{ steps.filter.outputs.appbuilds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'server-go/**'
              - 'excalibase-vault/**'
              - 'shared-fixtures/**'
            frontend:
              - 'frontend/**'
              - 'server-go/internal/shiptemplates/testdata/**'
              - 'shared-fixtures/**'
            deno:
              - 'deno-server/**'
              - 'server-go/internal/k8s/deno_fence.ts'
            ci:
              - '.github/workflows/**'
              - 'scripts/cve-watch/**'
              - 'tests/cve-watch/**'
              - 'scripts/guard-release-tag.sh'
              - 'scripts/release-*.sh'
              - 'tests/cd-*.sh'
              - 'tests/release-*.sh'
              - 'scripts/k3d-import-image.sh'
              - 'tests/k3d-import-*.sh'
              - 'security/**'
            singlehost:
              - 'deploy/single-host/**'
              - 'frontend/nginx.conf'
              - 'frontend/docker-entrypoint.d/**'
            gatewayguard:
              - 'charts/documentdb-gateway/**'
              - 'server-go/internal/config/postgres_catalog.yaml'
            singlehostboot:
              - 'deploy/single-host/**'
              - 'server-go/Dockerfile'
              - 'server-go/cmd/engine-proxy/**'
              - 'server-go/internal/engineproxy/**'
              - 'server-go/internal/dockerapps/**'
              - 'server-go/cmd/app-probe/**'
              - 'server-go/internal/hostlogs/**'
              - 'server-go/internal/enginestats/**'
              - 'server-go/internal/dockerbuilds/**'
              - 'server-go/internal/imagepull/**'
              - 'server-go/internal/buildegress/**'
              - 'server-go/cmd/build-egress/**'
              - 'server-go/cmd/server/site_builds.go'
              - 'server-go/internal/k8s/site_build_scripts/**'
              - 'server-go/internal/logdrain/**'
              - 'server-go/internal/hostaddr/**'
              - 'server-go/internal/publicaddr/**'
              - 'server-go/cmd/log-forwarder/**'
              - 'server-go/internal/service/log_drains*'
              - 'server-go/internal/provisioner/docker*'
              - 'server-go/internal/service/backup_*docker*'
              - 'server-go/internal/service/query_stats*'
              - 'frontend/Dockerfile'
            sitesrouter:
              - 'edge/sites-router/**'
              - 'server-go/internal/sites/testdata/router-entry-*'
            sitesoutbound:
              - 'edge/sites-outbound/**'
            sitebuilds:
              - 'server-go/internal/k8s/site_build*'
              - 'server-go/internal/k8s/testdata/site_build_vite/**'
              - 'server-go/internal/k8s/gvisor_k3s_test.go'
              - 'server-go/internal/sitebuilds/**'
            appbuilds:
              - 'server-go/internal/k8s/app_build*'
              - 'server-go/internal/k8s/build_jobs.go'
              - 'server-go/internal/k8s/site_build_status.go'
              - 'server-go/internal/k8s/site_build_job.go'
              - 'server-go/internal/k8s/app_egress_policy.go'
              - 'server-go/internal/k8s/site_build_scripts/**'
              - 'server-go/internal/k8s/testdata/app_build_node/**'
              - 'server-go/internal/k8s/gvisor_k3s_test.go'
              - 'server-go/internal/appbuilds/**'
              - 'server-go/internal/config/app_builds.go'
            hosting:
              - 'server-go/internal/k8s/app_*'
              - 'server-go/internal/k8s/*_k3s_test.go'
              - 'server-go/internal/k8s/deno_*'
              - 'server-go/internal/testutil/fenceprobe/**'
              - 'server-go/internal/k8s/testdata/app_workload/**'
              - 'server-go/internal/apphost/**'
              - 'server-go/internal/service/app_deploy*'
            mysqlbackup:
              - 'server-go/internal/k8s/moco_*'
              - 'server-go/internal/k8s/mysql_tls*'
              - 'server-go/internal/k8s/client.go'
              - 'server-go/internal/k8s/app_egress_k3s_test.go'
            failedprovisioning:
              - 'server-go/internal/service/provisioning_rollback_retry.go'
              - 'server-go/internal/service/provisioning_database.go'
              - 'server-go/internal/service/restore_completion.go'
              - 'server-go/internal/service/deletion_grace.go'
              - 'server-go/internal/service/project_registration.go'
              - 'server-go/internal/service/provisioning_failure_live_test.go'
              - 'server-go/internal/provisioner/context.go'
              - 'server-go/internal/k8s/exec_transport.go'

  single-host:
    name: Single-host bundle
    needs: changes
    if: needs.changes.outputs.singlehost == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Hardening, init, preflight and bootstrap
        run: |
          for t in single-host edge-listener init-env subids preflight bootstrap host-firewall; do
            sh deploy/single-host/tests/$t.sh
          done
      - name: Host firewall gates provisioning and the edge (real Compose)
        run: sh deploy/single-host/tests/host-firewall-gate.sh docker
      - name: Sites deploy upload on the edge (real Caddy)
        run: sh deploy/single-host/tests/sites-edge.sh docker
      - name: API upload size on the edge (real Caddy and Studio nginx)
        run: sh deploy/single-host/tests/api-upload-edge.sh docker

  release-tags:
    name: Release tag plan
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Native tag plan
        run: |
          bash tests/release-native-tags-test.sh
          bash tests/release-slim-tags-test.sh
          bash tests/release-tags-test.sh

      - name: CD tag plan
        run: |
          bash tests/cd-plan-test.sh
          bash tests/cd-guard-test.sh
          bash tests/k3d-import-image-test.sh

      - name: Release gate
        run: |
          bash tests/cve-watch/gate-test.sh
          bash tests/cve-watch/workflow-test.sh

  gateway-guard:
    name: DocumentDB gateway guard
    needs: changes
    if: needs.changes.outputs.gatewayguard == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Guard logic
        run: bash charts/documentdb-gateway/tests/gateway_guard_test.sh
      - name: Build the image
        run: docker build -q -t documentdb-gateway-guard charts/documentdb-gateway
      - name: Guard in the image, with real Postgres
        run: bash charts/documentdb-gateway/tests/gateway_guard_demotion_test.sh documentdb-gateway-guard
      - name: Trivy (image)
        uses: ./.github/actions/trivy
        with:
          image: documentdb-gateway-guard

  sites-router:
    name: Sites router Worker
    needs: changes
    if: needs.changes.outputs.sitesrouter == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: edge/sites-router
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: edge/sites-router/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Deploy script (curl faked, nothing reaches Cloudflare)
        run: sh test/deploy.sh

  sites-outbound:
    name: Sites outbound Worker
    needs: changes
    if: needs.changes.outputs.sitesoutbound == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: edge/sites-outbound
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: edge/sites-outbound/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Deploy script (curl faked, nothing reaches Cloudflare)
        run: sh test/deploy.sh

  # EXC-872: the boot checks ran one after another in one job (2h15m). The images are built
  # once here and loaded into each shard; every shard is its own runner with fresh Docker state.
  # An artifact (not a registry push) so a fork PR, which has no push secret, builds the same way.
  single-host-boot-images:
    name: Single-host boot images
    needs: changes
    if: needs.changes.outputs.singlehostboot == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build provisioning and Studio from this checkout
        run: |
          docker build -q -t docker.io/excalibase/provisioning:ci server-go
          docker build -q -t docker.io/excalibase/studio:ci frontend
          docker save docker.io/excalibase/provisioning:ci docker.io/excalibase/studio:ci | gzip -1 > single-host-images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: single-host-images
          path: single-host-images.tar.gz
          retention-days: 1
          compression-level: 0
      # EXC-880: each third-party image is pulled once here (with retries) and loaded by the
      # shards, which used to pull them all again at the same moment and hit the rate limits.
      - name: Pull the fence images once
        run: sh deploy/ci/third-party-images.sh save single-host-fence third-party-single-host-fence.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-single-host-fence
          path: third-party-single-host-fence.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Pull the smoke images once
        run: sh deploy/ci/third-party-images.sh save single-host-smoke third-party-single-host-smoke.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-single-host-smoke
          path: third-party-single-host-smoke.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Pull the gvisor images once
        run: sh deploy/ci/third-party-images.sh save single-host-gvisor third-party-single-host-gvisor.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-single-host-gvisor
          path: third-party-single-host-gvisor.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Pull the mysql images once
        run: sh deploy/ci/third-party-images.sh save single-host-mysql third-party-single-host-mysql.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-single-host-mysql
          path: third-party-single-host-mysql.tar.gz
          retention-days: 1
          compression-level: 0

  # One fresh install per shard; the firewall and bridge checks are the first shard.
  single-host-boot-shard:
    name: Single-host boot shard (${{ matrix.name }})
    needs: [changes, single-host-boot-images]
    if: needs.changes.outputs.singlehostboot == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    # Each shard keeps the timeout of the work it holds; the longest ran 45 minutes in one job.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fence
            script: fence
          - name: backups
            script: smoke
            pg_backups: "1"
            major_upgrade: "1"
          - name: unseal
            script: smoke
            manual_unseal: "1"
            host_metrics: "1"
            host_logs: "1"
            request_metrics: "1"
            log_drains: "1"
            # Trunk builds that bind the counters' address (EXC-673); bump with the engines.
            graphql_image: docker.io/excalibase/excalibase-graphql:main-72a7b22
            auth_image: docker.io/excalibase/excalibase-auth:main-8449290
          - name: mysql
            script: smoke
            mysql: "1"
          - name: gvisor
            script: smoke
            gvisor: "1"
            apps: "1"
            site_builds: "1"
            app_sandbox: runsc
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Anonymous pulls hit Docker Hub's rate limit (EXC-752); fork PRs have no secret and
      # pull anonymously. The login covers what the docker CLI pulls on the host: the dind
      # images, `docker build` base images and the compose pulls. The Docker-in-Docker machines
      # pull nothing themselves (their images are loaded from the host), so no credential
      # goes into them.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Provisioning pulls through the daemon API without registry auth, so those pulls stay
      # anonymous whatever the runner logged in as. The images job pulled them once; loaded here,
      # the daemon finds them local (EXC-880).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.script == 'fence'
        with:
          name: third-party-single-host-fence
          path: ${{ runner.temp }}/third-party-fence
      - name: Load the fence images
        if: matrix.script == 'fence'
        run: sh deploy/ci/third-party-images.sh load single-host-fence "$RUNNER_TEMP/third-party-fence/third-party-single-host-fence.tar.gz"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.script == 'smoke'
        with:
          name: third-party-single-host-smoke
          path: ${{ runner.temp }}/third-party-smoke
      - name: Load the smoke images
        if: matrix.script == 'smoke'
        run: sh deploy/ci/third-party-images.sh load single-host-smoke "$RUNNER_TEMP/third-party-smoke/third-party-single-host-smoke.tar.gz"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.gvisor == '1'
        with:
          name: third-party-single-host-gvisor
          path: ${{ runner.temp }}/third-party-gvisor
      - name: Load the gvisor images
        if: matrix.gvisor == '1'
        run: sh deploy/ci/third-party-images.sh load single-host-gvisor "$RUNNER_TEMP/third-party-gvisor/third-party-single-host-gvisor.tar.gz"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: matrix.mysql == '1'
        with:
          name: third-party-single-host-mysql
          path: ${{ runner.temp }}/third-party-mysql
      - name: Load the mysql images
        if: matrix.mysql == '1'
        run: sh deploy/ci/third-party-images.sh load single-host-mysql "$RUNNER_TEMP/third-party-mysql/third-party-single-host-mysql.tar.gz"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: single-host-images
      - name: Load provisioning and Studio built from this checkout
        run: gunzip -c single-host-images.tar.gz | docker load
      - name: Tenants wait for the host firewall across real reboots (Docker in Docker)
        if: matrix.script == 'fence'
        run: sh deploy/single-host/tests/reboot-order.sh
      - name: Project bridges are fenced from an app's first instruction (Docker in Docker)
        if: matrix.script == 'fence'
        run: |
          for version in 27 28 29; do
            DIND_IMAGE=docker.io/library/docker:$version-dind sh deploy/single-host/tests/project-bridge-fence.sh
          done
      # Containers on a single host (EXC-575) run under gVisor; the runner gets it from gVisor's apt repository.
      - name: Install gVisor (runsc) into Docker
        if: matrix.gvisor == '1'
        run: sh deploy/single-host/tests/install-gvisor.sh
      - name: Fresh install (${{ matrix.name }})
        if: matrix.script == 'smoke'
        # Ends the step itself, 10 minutes before the job's 90, so a hang is a red step with a log.
        timeout-minutes: 80
        env:
          PLATFORM_TAG: ci
          PG_BACKUPS: ${{ matrix.pg_backups }}
          MAJOR_UPGRADE: ${{ matrix.major_upgrade }}
          MANUAL_UNSEAL: ${{ matrix.manual_unseal }}
          HOST_METRICS: ${{ matrix.host_metrics }}
          HOST_LOGS: ${{ matrix.host_logs }}
          REQUEST_METRICS: ${{ matrix.request_metrics }}
          LOG_DRAINS: ${{ matrix.log_drains }}
          GRAPHQL_IMAGE: ${{ matrix.graphql_image }}
          AUTH_IMAGE: ${{ matrix.auth_image }}
          MYSQL: ${{ matrix.mysql }}
          APPS: ${{ matrix.apps }}
          SITE_BUILDS: ${{ matrix.site_builds }}
          APP_SANDBOX: ${{ matrix.app_sandbox }}
        run: bash deploy/single-host/tests/boot-smoke.sh docker

  # The name the earlier single job carried: one check that holds every shard. It passes when the
  # filter skipped them all, and fails when any shard failed, was cancelled or did not run.
  single-host-boot:
    name: Single-host boot (Docker)
    needs: [changes, single-host-boot-images, single-host-boot-shard]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every shard passed, or the filter skipped them
        env:
          WANTED: ${{ needs.changes.outputs.singlehostboot == 'true' || needs.changes.outputs.ci == 'true' }}
          CHANGES: ${{ needs.changes.result }}
          IMAGES: ${{ needs.single-host-boot-images.result }}
          SHARDS: ${{ needs.single-host-boot-shard.result }}
        run: |
          echo "wanted=$WANTED changes=$CHANGES images=$IMAGES shards=$SHARDS"
          [ "$CHANGES" = success ] || { echo "change detection did not succeed"; exit 1; }
          if [ "$WANTED" = true ]; then
            [ "$IMAGES" = success ] && [ "$SHARDS" = success ] || { echo "a boot job failed, was cancelled or did not run"; exit 1; }
          else
            [ "$IMAGES" = skipped ] && [ "$SHARDS" = skipped ] || { echo "boot jobs ran although the filter skipped them"; exit 1; }
          fi

  go-lint:
    name: Go Lint
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            server-go/go.sum
            excalibase-vault/go.sum
      - run: go vet ./...
      # Tagged tests only run in their own jobs; compile them on every PR.
      - run: go vet -tags=integration ./... && go vet -tags=live ./...
      - name: Integration shard scripts
        run: scripts/integration_shard_test.sh
      - name: Integration test images are in the pre-pull list
        working-directory: .
        run: sh deploy/ci/third-party-images.sh check
      - run: go build ./...
      # The standalone HTTP vault is a sibling module that depends on
      # server-go via a replace directive; build it here so a pkg/vault
      # change cannot silently break it.
      - name: Vet + build excalibase-vault
        working-directory: excalibase-vault
        run: go vet ./... && go build ./... && go test ./...

  go-test:
    name: Go Test
    runs-on: ubuntu-24.04
    needs: [changes, go-lint]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: server-go/go.sum
      # Fast unit smoke (default build tags, no Docker). The 70% coverage gate
      # + coverage artifact live in the go-integration job, which runs the full
      # suite (-tags integration) where the store + handler tests execute — that
      # is the true total. Measuring coverage here would see only ~52% because
      # those suites are integration-tagged.
      - run: go test ./internal/... -race -cover -timeout 5m

  frontend-lint:
    name: Frontend Type Check
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit

  frontend-test:
    name: Frontend Unit (vitest)
    runs-on: ubuntu-24.04
    needs: [changes, frontend-lint]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Storage origin in the page policy
        run: sh tests/storage-origin.test.sh
      # Unit tests only (vitest, no backend); the mocked Playwright suite runs in
      # frontend-e2e below.
      #
      # With coverage: the lcov it writes is the only coverage data Sonar has for
      # TypeScript (sonar.javascript.lcov.reportPaths), and without it every
      # changed .ts/.tsx line counts as uncovered against the new-code gate.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

  frontend-e2e:
    name: Studio E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: [changes, frontend-lint]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Every API call is mocked with page.route against the Vite dev server;
      # e2e/live/** needs STUDIO_LIVE_URL and is left out of this run.
      - run: npx playwright test
        env:
          CI: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  deno-test:
    name: Deno Unit (deno-server + vendored lib)
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.deno == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: deno-server/lib/excalibase-server/package-lock.json
      # The vendored @excalibase/server lib ships its own jest suite; run it,
      # then build the dist the Deno import map points at.
      - name: Vendored lib — test + build
        working-directory: deno-server/lib/excalibase-server
        run: |
          npm ci
          npm test
          npm run build
      # Install Deno with the official script pinned to the exact version the
      # deno-server/Dockerfile base image uses (alpine-2.5.5). setup-deno@v2's
      # version resolver failed on this version ("Could not resolve a version
      # for the given range"), so we don't depend on it.
      - name: Install Deno 2.5.5
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s v2.5.5
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          "$HOME/.deno/bin/deno" --version
      # Host-side runs resolve ./vendor/excalibase-server/index.mjs exactly as
      # the image does (vendor/ is gitignored). It must be a REAL directory,
      # not a symlink: the worker's scoped read permission is the realpath of
      # the vendored dir, so a symlinked path is lexically outside the grant
      # and every vendored import fails with PermissionDenied.
      - name: Stage vendored dist
        working-directory: deno-server
        run: |
          rm -rf vendor/excalibase-server
          mkdir -p vendor/excalibase-server coverage
          cp -r lib/excalibase-server/dist/. vendor/excalibase-server/
          test -f vendor/excalibase-server/index.mjs
      # scripts/run-tests.sh runs one `deno test` per file (avoids testcontainer
      # contention). Each file gets its own coverage subdir — `deno test
      # --coverage` clears its dir on start, so a shared one would keep only
      # the last file's profile — and they are merged into a single lcov here.
      - name: Deno tests (with coverage)
        working-directory: deno-server
        env:
          DENO_COVERAGE_DIR: cov
        run: |
          ./scripts/run-tests.sh
          deno coverage cov/* --lcov --output=coverage/lcov.info
          echo "lcov source files: $(grep -c '^SF:' coverage/lcov.info)"
      # The image itself: v2 functions and their zod load with no network,
      # as a project runtime has none by default (EXC-518).
      - name: Runtime image runs functions offline
        run: sh deno-server/scripts/image-offline-test.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deno-coverage
          path: deno-server/coverage/lcov.info

  defend:
    name: Defend (secrets + vulns + audit)
    runs-on: ubuntu-24.04
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks scans the full commit history, not just the tip.
          fetch-depth: 0
      # Secret scan across full history. We install the gitleaks CLI directly:
      # it needs no license (unlike the gitleaks-action v2), so it runs on any
      # repo. `detect` exits non-zero on findings, failing the job.
      - name: gitleaks secret scan
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --no-banner --redact
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
        with:
          go-version: '1.26.10'
          cache-dependency-path: server-go/go.sum
      # govulncheck flags known CVEs in the Go module graph + stdlib reachable
      # from compiled paths. Report-only (continue-on-error): an unfixable upstream
      # CVE (e.g. golang.org/x/crypto with no patched release) must not block every
      # merge — findings still surface in the log; fix fixable ones by bumping the dep.
      - name: govulncheck (Go CVEs)
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd server-go && "$(go env GOPATH)/bin/govulncheck" ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend)
        if: needs.changes.outputs.frontend == 'true'
        # Block on critical; highs still print (the current high is a dev-only
        # tool advisory, Vitest, not shipped in the app bundle).
        run: cd frontend && npm ci && npm audit --audit-level=critical

  # EXC-880: the shards' testcontainers images are pulled once here, not four times at once.
  go-integration-images:
    name: Go Integration images
    runs-on: ubuntu-24.04
    needs: [changes, go-lint]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the testcontainers images once
        run: sh deploy/ci/third-party-images.sh save go-integration third-party-go-integration.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-go-integration
          path: third-party-go-integration.tar.gz
          retention-days: 1
          compression-level: 0

  go-integration-shard:
    name: Go Integration shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    needs: [changes, go-lint, go-integration-images]
    permissions:
      contents: read
      packages: read
    # Integration tests need a Docker daemon (testcontainers spins up
    # Postgres, NATS, LocalStack, and one-off postgres containers for
    # restore E2Es). ubuntu-24.04 has Docker available out of the box.
    # Gated on backend changes — skipped on frontend-only PRs to keep
    # CI cost down.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Anonymous pulls hit Docker Hub's rate limit; fork PRs have no secret and
      # pull anonymously.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: third-party-go-integration
          path: ${{ runner.temp }}/third-party
      - name: Load the testcontainers images
        working-directory: .
        run: sh deploy/ci/third-party-images.sh load go-integration "$RUNNER_TEMP/third-party/third-party-go-integration.tar.gz"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: server-go/go.sum
      - name: Run integration shard
        # Each package's tests are dealt across four jobs by name: one job ran
        # internal/handler and internal/storage/postgres at ~640 s each against
        # the 12-min per-package timeout, since every test starts its own
        # Postgres container. -tags integration is the only build that runs
        # the store + handler suites, so coverage is measured here.
        run: >-
          go test -tags=integration ./internal/... ./pkg/... -race -cover
          -coverprofile=coverage-${{ matrix.shard }}.out -timeout 12m
          -run "$(scripts/integration-shard.sh ${{ matrix.shard }} 4)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-coverage-shard-${{ matrix.shard }}
          path: server-go/coverage-${{ matrix.shard }}.out

  go-integration:
    # The required check: passes only when every shard passed, and gates the
    # coverage of the shards together.
    name: Go Integration (testcontainers)
    runs-on: ubuntu-24.04
    needs: [changes, go-integration-shard]
    # !cancelled(): a failed shard must fail this check, not skip it.
    if: ${{ !cancelled() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true') }}
    defaults:
      run:
        working-directory: server-go
    steps:
      - name: Every shard passed
        if: needs.go-integration-shard.result != 'success'
        run: echo "integration shards ${{ needs.go-integration-shard.result }}" && exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: server-go/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: go-coverage-shard-*
          merge-multiple: true
          path: server-go
      - name: Merge shard coverage
        run: scripts/merge-coverprofiles.sh coverage.out coverage-*.out
      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if (( $(echo "$total < 70" | bc -l) )); then
            echo "Coverage ${total}% is below 70% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-coverage
          path: server-go/coverage.out

  live-cluster:
    name: Live cluster tests (hosting)
    runs-on: ubuntu-24.04
    needs: [changes, go-lint]
    # Real k3s clusters (gVisor, deploy rollouts, Cilium egress); only when hosting code changes.
    if: needs.changes.outputs.hosting == 'true'
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: server-go/go.sum
      - name: Run live cluster tests
        run: go test -tags=live ./internal/k8s/ -run 'TestK3s' -skip 'StartFence|MySQLBackup|TestK3sSiteBuild|TestK3sAppBuild' -v -timeout 50m

  live-start-fence:
    name: Live cluster tests (start fence)
    runs-on: ubuntu-24.04
    needs: [changes, go-lint]
    # EXC-622: workloads start the real way with a probe at t=0; nothing fenced may answer.
    if: needs.changes.outputs.hosting == 'true'
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: server-go/go.sum
      - name: Run start-fence probes
        run: go test -tags=live ./internal/k8s/ -run 'TestK3s.*StartFence' -v -timeout 30m

  live-mysql-backup:
    name: Live cluster tests (MySQL backup)
    runs-on: ubuntu-24.04
    needs: [changes, go-lint]
    # EXC-586: MOCO's real backup Job under the project policies, on kube-router and on production Cilium.
    if: needs.changes.outputs.mysqlbackup == 'true'
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: server-go/go.sum
      - name: Run MySQL backup egress probes
        run: go test -tags=live ./internal/k8s/ -run 'TestK3s.*MySQLBackup' -v -timeout 40m

  live-failed-provisioning:
    name: Live failed provisioning
    runs-on: ubuntu-24.04
    needs: [changes, go-lint]
    # EXC-534: seals, dropped requests and failed rollbacks on real k3s, CloudNativePG and vault; about 15 minutes.
    if: needs.changes.outputs.failedprovisioning == 'true'
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: server-go/go.sum
      - name: Run failed provisioning scenarios
        run: go test -tags=live ./internal/service/ -run 'TestLiveFailedProvisioning' -v -count=1 -timeout 45m

  live-site-builds:
    name: Live site builds (gVisor)
    runs-on: ubuntu-24.04
    needs: [changes, go-lint]
    # A real Vite build through the site build Job under gVisor (EXC-354); its own job so the hosting suite keeps its time.
    if: needs.changes.outputs.sitebuilds == 'true'
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
          cache-dependency-path: server-go/go.sum
      - name: Run the site build Job under gVisor
        run: go test -tags=live ./internal/k8s/ -run 'TestK3sSiteBuild' -v -timeout 30m

  live-app-builds:
    name: Live app builds (gVisor)
    runs-on: ubuntu-24.04
    needs: [changes, go-lint]
    # Dockerfile (rootless BuildKit) and Buildpacks image builds through the app build Job under gVisor (EXC-547).
    if: needs.changes.outputs.appbuilds == 'true'
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.10'
      - name: Run the app build Job under gVisor
        run: go test -tags=live ./internal/k8s/ -run 'TestK3sAppBuild' -v -timeout 45m

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-24.04
    # frontend-test produces the TypeScript lcov, so the scan has to wait for
    # it too; !cancelled() below still lets the scan run when it is skipped.
    needs: [changes, go-integration, deno-test, frontend-test]
    # !cancelled(): a skipped upstream job (e.g. go-integration on a deno-only
    # PR) must not skip the scan; the coverage downloads below tolerate a
    # missing artifact.
    # A push to a release branch is not scanned: its commits are cherry-picks of
    # main commits already scanned there, and the plan has one analysed branch.
    # The coverage gate (go-integration) still runs. Pull requests into a
    # release branch are scanned.
    if: ${{ !cancelled() && !startsWith(github.ref, 'refs/heads/release/') && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.deno == 'true' || needs.changes.outputs.ci == 'true') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # SonarCloud needs full history for accurate blame/new-code analysis.
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-coverage
          path: server-go
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deno-coverage
          path: deno-server/coverage
        continue-on-error: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-coverage
          path: frontend/coverage
        continue-on-error: true
      # SonarSource/sonarqube-scan-action v6 wraps sonar-scanner-cli 8.x —
      # the same engine SonarCloud runs, so local/CI scans match cloud
      # results. Local validation: ./scripts/sonar-local.sh
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
