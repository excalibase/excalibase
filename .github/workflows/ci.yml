name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deno: ${{ steps.filter.outputs.deno }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server-go/**'
            frontend:
              - 'frontend/**'
            deno:
              - 'deno-server/**'
            ci:
              - '.github/workflows/**'

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go build ./...

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    needs: [changes, go-lint]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # Fast unit smoke (default build tags, no Docker). The 70% coverage gate
      # + coverage artifact live in the go-integration job, which runs the full
      # suite (-tags integration) where the store + handler tests execute — that
      # is the true total. Measuring coverage here would see only ~52% because
      # those suites are integration-tagged.
      - run: go test ./internal/... -race -cover -timeout 5m

  frontend-lint:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-test:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [changes, frontend-lint]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  defend:
    name: Defend (secrets + vulns + audit)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the full commit history, not just the tip.
          fetch-depth: 0
      # Secret scan across full history. We install the gitleaks CLI directly:
      # it needs no license (unlike the gitleaks-action v2), so it runs on any
      # repo. `detect` exits non-zero on findings, failing the job.
      - name: gitleaks secret scan
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks detect --source . --no-banner --redact
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
        with:
          go-version: '1.24'
      # govulncheck flags known CVEs in the Go module graph + stdlib reachable
      # from compiled paths. Report-only (continue-on-error): an unfixable upstream
      # CVE (e.g. golang.org/x/crypto with no patched release) must not block every
      # merge — findings still surface in the log; fix fixable ones by bumping the dep.
      - name: govulncheck (Go CVEs)
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd server-go && "$(go env GOPATH)/bin/govulncheck" ./...
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (frontend)
        if: needs.changes.outputs.frontend == 'true'
        run: cd frontend && npm ci && npm audit --audit-level=high

  go-integration:
    name: Go Integration (testcontainers)
    runs-on: ubuntu-latest
    needs: [changes, go-lint]
    # Integration tests need a Docker daemon (testcontainers spins up
    # Postgres, NATS, LocalStack, and one-off postgres containers for
    # restore E2Es). ubuntu-latest has Docker available out of the box.
    # Gated on backend changes — skipped on frontend-only PRs to keep
    # CI cost down. Manually trigger on workflow_dispatch when needed.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run integration suite + coverage gate
        # 12-min timeout covers the slowest path: PITR_TargetVariants
        # (60s) + RestoreE2E (10s) + LocalStack/Postgres bring-up (~15s
        # per testcontainer) + the rest of the integration suite. Coverage is
        # measured here because -tags integration is the only build that runs
        # the store + handler suites — it's the true total (~72%).
        run: go test -tags=integration ./internal/... -race -cover -coverprofile=coverage.out -timeout 12m
      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if (( $(echo "$total < 70" | bc -l) )); then
            echo "Coverage ${total}% is below 70% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: server-go/coverage.out

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [changes, go-integration]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud needs full history for accurate blame/new-code analysis.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: go-coverage
          path: server-go
        continue-on-error: true
      # SonarSource/sonarqube-scan-action v6 wraps sonar-scanner-cli 8.x —
      # the same engine SonarCloud runs, so local/CI scans match cloud
      # results. Local validation: ./scripts/sonar-local.sh
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
