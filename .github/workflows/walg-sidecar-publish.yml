name: Publish walg-sidecar

# Publishes excalibase/walg-sidecar:<tag> on tags that match
# walg-sidecar-v*. The Phase-2 backup adapter (Docker mode) pulls
# this image at provision time, so the tag must be available in GHCR
# before any restored project can run with WAL-G archiving.

on:
  push:
    tags:
      - 'walg-sidecar-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. 0.1.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # walg-sidecar-v0.1.0 → 0.1.0
            echo "value=${GITHUB_REF_NAME#walg-sidecar-v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      # Docker Hub, the registry the platform pulls from. Nothing here has
      # ever been deployed from GHCR, and an image nobody can pull is the
      # same as no image (EXC-430).
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: charts/walg-sidecar
          push: true
          tags: |
            excalibase/walg-sidecar:${{ steps.tag.outputs.value }}
            excalibase/walg-sidecar:latest
          platforms: linux/amd64

      - name: Snyk container scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: excalibase/walg-sidecar:${{ steps.tag.outputs.value }}
          args: --severity-threshold=high
        continue-on-error: false
