name: Release

# Tags an already-proven build. Nothing is built here: a release must be the
# bits a green AIO nightly installed, and two builds of one commit do not
# produce the same digest (EXC-433). imagetools copies the manifest, so the
# released image and the tested image are the same object.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix, e.g. 1.0.0 or 1.2.0-rc.1"
        required: true
      source_tag:
        description: "Tag to promote from, e.g. main-c2565093 (default: main)"
        default: main
      services:
        description: "Images to release"
        default: "provisioning,excalibase-graphql,excalibase-auth,studio"

permissions:
  contents: read

jobs:
  retag:
    name: Retag ${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A pre-release names a candidate and must not move the floating tags a
      # consumer follows: 1.2.0-rc.1 gets its own tag and nothing else.
      - name: Work out which tags this version carries
        id: plan
        run: |
          version='${{ inputs.version }}'
          case "$version" in
            v*) echo "::error::drop the v prefix: the git tag is v$version, the image tag is ${version#v}"; exit 1 ;;
            *+*) echo "::error::a docker tag cannot contain '+'; use '-' or an OCI label"; exit 1 ;;
          esac
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if printf '%s' "$version" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tags=$version" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tags=$version $major.$minor $major latest" >> "$GITHUB_OUTPUT"
          fi

      # The native engine image is a supported choice for small machines. It is
      # promoted from the same commit's <source_tag>-native, by name. An engine
      # build from before the native tags existed has none: skip it, say so.
      - name: Retag the native engine image
        if: contains(format(',{0},', inputs.services), ',excalibase-graphql,')
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -eu
          repository="excalibase/excalibase-graphql"
          source="$repository:$SOURCE_TAG-native"
          digest=$(docker buildx imagetools inspect "$source" 2>/dev/null | awk '/^Digest:/ { print $2; exit }') || true
          if [ -z "${digest:-}" ] || [ "$digest" = "null" ]; then
            echo "::notice::$source does not exist (engine build without a native image); native not released for $VERSION"
            echo "Native image: skipped, $source does not exist" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if docker buildx imagetools inspect "$repository:$VERSION-native" >/dev/null 2>&1; then
            echo "::error::$repository:$VERSION-native already exists; cut a new version instead"
            exit 1
          fi
          tags=$(bash scripts/release-native-tags.sh "$VERSION")
          refs=""
          for tag in $tags; do refs="$refs -t $repository:$tag"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create $refs "$repository@$digest"
          echo "released $repository@$digest as $tags"
          echo "Native image: $repository@$digest as $tags" >> "$GITHUB_STEP_SUMMARY"

      - name: Retag each service
        run: |
          set -eu
          summary=""
          for service in $(printf '%s' '${{ inputs.services }}' | tr ',' ' '); do
            repository="excalibase/$service"
            # A released version never moves: the chart pins it by tag alone.
            if docker buildx imagetools inspect "$repository:${{ inputs.version }}" >/dev/null 2>&1; then
              echo "::error::$repository:${{ inputs.version }} already exists; cut a new version instead"
              exit 1
            fi
            # `inspect` prints "Digest: sha256:…". Parsed rather than asked
            # for as a Go template: Actions evaluates that brace syntax first,
            # even inside a shell comment, and fails to parse the workflow.
            digest=$(docker buildx imagetools inspect "$repository:${{ inputs.source_tag }}" \
              | awk '/^Digest:/ { print $2; exit }')
            test -n "$digest" && test "$digest" != "null"

            refs=""
            for tag in ${{ steps.plan.outputs.tags }}; do refs="$refs -t $repository:$tag"; done
            # shellcheck disable=SC2086
            docker buildx imagetools create $refs "$repository@$digest"

            echo "released $repository@$digest as ${{ steps.plan.outputs.tags }}"
            summary="$summary- \`$repository@$digest\`\n"
          done
          {
            echo "### Released ${{ inputs.version }}"
            echo ""
            echo "Tags: ${{ steps.plan.outputs.tags }}"
            echo ""
            printf "%b" "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
