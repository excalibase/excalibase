name: Release

# Tags an already-proven build. Nothing is built here: a release must be the
# bits a green AIO nightly installed, and two builds of one commit do not
# produce the same digest (EXC-433). imagetools copies the manifest, so the
# released image and the tested image are the same object.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix, e.g. 1.0.0 or 1.2.0-rc.1"
        required: true
      source_tag:
        description: "Tag to promote from, e.g. main-c2565093 (default: main)"
        default: main
      services:
        description: "Images to release"
        default: "provisioning,excalibase-graphql,excalibase-auth,studio"

permissions:
  contents: read

jobs:
  retag:
    name: Retag ${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A pre-release names a candidate and must not move the floating tags a
      # consumer follows: 1.2.0-rc.1 gets its own tag and nothing else.
      - name: Work out which tags this version carries
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SERVICES: ${{ inputs.services }}
        run: |
          set -eu
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$VERSION" | grep -Eq "$semver"; then
            echo "::error::version must be MAJOR.MINOR.PATCH with an optional -prerelease and no v prefix or +build (a docker tag cannot contain '+')"
            exit 1
          fi
          if ! printf '%s' "$SOURCE_TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::source_tag may only contain letters, digits, '.', '_' and '-'"
            exit 1
          fi
          if ! printf '%s' "$SERVICES" | grep -Eq '^[a-z0-9-]+(,[a-z0-9-]+)*$'; then
            echo "::error::services must be a comma-separated list of image names"
            exit 1
          fi
          major="${VERSION%%.*}"
          rest="${VERSION#*.}"
          minor="${rest%%.*}"
          if printf '%s' "$VERSION" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tags=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "tags=$VERSION $major.$minor $major latest" >> "$GITHUB_OUTPUT"
          fi

      # Every check runs before any tag moves, so a refusal never leaves a
      # half-released version. The native engine image is promoted from the same
      # commit's <source_tag>-native; an engine build from before native tags
      # existed has none, and that genuine not-found is skipped with a notice.
      # Any other registry error fails the job.
      - name: Retag each service
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          SERVICES: ${{ inputs.services }}
          TAGS: ${{ steps.plan.outputs.tags }}
        run: |
          set -eu
          services=$(printf '%s' "$SERVICES" | tr ',' ' ')
          plan=$(mktemp)

          # Phase 1: resolve every source and prove every target is absent.
          for service in $services; do
            repository="excalibase/$service"
            status=0; bash scripts/inspect-digest.sh "$repository:$VERSION" >/dev/null || status=$?
            case "$status" in
              0) echo "::error::$repository:$VERSION already exists; cut a new version instead"; exit 1 ;;
              3) ;;
              *) echo "::error::could not check $repository:$VERSION"; exit 1 ;;
            esac
            status=0; digest=$(bash scripts/inspect-digest.sh "$repository:$SOURCE_TAG") || status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::could not resolve $repository:$SOURCE_TAG (status $status)"
              exit 1
            fi
            echo "$repository $digest $TAGS" >> "$plan"

            if [ "$service" = "excalibase-graphql" ]; then
              status=0; native=$(bash scripts/inspect-digest.sh "$repository:$SOURCE_TAG-native") || status=$?
              case "$status" in
                0)
                  native_tags=$(bash scripts/release-native-tags.sh "$VERSION")
                  first=${native_tags%% *}
                  status=0; bash scripts/inspect-digest.sh "$repository:$first" >/dev/null || status=$?
                  case "$status" in
                    0) echo "::error::$repository:$first already exists; cut a new version instead"; exit 1 ;;
                    3) ;;
                    *) echo "::error::could not check $repository:$first"; exit 1 ;;
                  esac
                  echo "$repository $native $native_tags" >> "$plan"
                  ;;
                3)
                  echo "::notice::$repository:$SOURCE_TAG-native does not exist (engine build without a native image); native not released for $VERSION"
                  echo "Native image: skipped, $repository:$SOURCE_TAG-native does not exist" >> "$GITHUB_STEP_SUMMARY"
                  ;;
                *) echo "::error::could not check $repository:$SOURCE_TAG-native"; exit 1 ;;
              esac
            fi
          done

          # Phase 2: create.
          summary=""
          while read -r repository digest tags; do
            refs=""
            for tag in $tags; do refs="$refs -t $repository:$tag"; done
            # shellcheck disable=SC2086
            docker buildx imagetools create $refs "$repository@$digest"
            echo "released $repository@$digest as $tags"
            summary="$summary- \`$repository@$digest\` as $tags\n"
          done < "$plan"
          {
            echo "### Released $VERSION"
            echo ""
            printf "%b" "$summary"
          } >> "$GITHUB_STEP_SUMMARY"
