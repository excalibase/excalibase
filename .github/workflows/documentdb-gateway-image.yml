name: Publish the DocumentDB gateway image

# EXC-587. Publishes excalibase/documentdb-gateway, upstream's gateway with the
# guard that ends client connections when its instance is demoted or Postgres
# stops answering. One build: what the tests and the scan saw is what is pushed.
# The digest in the job summary then goes into the catalogue.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE: excalibase/documentdb-gateway:0.117.0

jobs:
  publish:
    # Only reviewed code is published: the tag is what the catalogue's digest comes from.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Guard logic
        run: bash charts/documentdb-gateway/tests/gateway_guard_test.sh
      - name: Build the candidate image
        run: docker build --pull --platform linux/amd64 -t "$CANDIDATE" charts/documentdb-gateway
      - name: Guard in the image, with real Postgres
        run: bash charts/documentdb-gateway/tests/gateway_guard_demotion_test.sh "$CANDIDATE"
      - name: Trivy (candidate)
        uses: ./.github/actions/trivy
        with:
          image: ${{ env.CANDIDATE }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the verified image
        run: |
          docker push "$CANDIDATE"
          digest="$(docker inspect "$CANDIDATE" --format '{{index .RepoDigests 0}}')"
          echo "Pin this in the catalogue: documentDBGatewayImage: $digest" >> "$GITHUB_STEP_SUMMARY"
