name: Publish the DocumentDB gateway image

# EXC-587. Publishes excalibase/documentdb-gateway, upstream's gateway with the
# guard that ends client connections when an instance is demoted. Pushes only
# after the guard's tests and the scan pass; the digest in the job summary then
# goes into server-go/internal/config/postgres_catalog.yaml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Guard tests
        run: bash charts/documentdb-gateway/tests/gateway_guard_test.sh
      - name: Build the candidate image
        uses: docker/build-push-action@v6
        with:
          context: charts/documentdb-gateway
          push: false
          load: true
          tags: excalibase-documentdb-gateway-candidate:0.117.0
          platforms: linux/amd64
      - name: Trivy (candidate)
        uses: ./.github/actions/trivy
        with:
          image: excalibase-documentdb-gateway-candidate:0.117.0
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the verified image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: charts/documentdb-gateway
          push: true
          tags: excalibase/documentdb-gateway:0.117.0
          platforms: linux/amd64
      - name: Record the digest to pin
        run: echo "documentDBGatewayImage excalibase/documentdb-gateway@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
