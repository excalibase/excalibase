name: E2E (k3d smoke)

# Scoped control-plane smoke on a real Kubernetes cluster. We use k3d (k3s in
# Docker), NOT minikube: minikube's docker driver aborts on hosted runners
# (exit 29 "docker only supported on Linux with ...") whereas k3d's k3s-in-a-
# container works reliably on ubuntu-latest.
#
# Scope (deliberately narrow — reliability over ambition):
#   * bring up the provisioning service + its Postgres platform store, using
#     the repo's own charts/provisioning helm chart (not hand-rolled manifests)
#   * assert /healthz returns 200 once the deployment rolls out
#
# We do NOT run a full provision→ACTIVE→deprovision cycle here: that needs the
# CloudNativePG operator (multi-tenant DB provisioning) or an in-cluster Docker
# socket, which is too heavy/flaky for a 2-core/7GB hosted runner. A flaky e2e
# is worse than none. Because even this scoped smoke builds an image, boots a
# cluster, and waits on a helm rollout (~5-8 min), it runs on schedule +
# manual dispatch + post-merge push to the CI branches — it does NOT gate PRs.
#
# It also boots provisioning the way production does with MySQL off (EXC-631,
# the v1.6.0 incident): the sized-storage budget on, a project namespace
# present, no MOCO and no MOCO rights. The nightly AIO always installs MySQL,
# so only this catches a budget that asks for MySQL clusters it may not list.
# That is why it also gates pull requests touching the boot path.
on:
  workflow_dispatch:
  schedule:
    # 03:30 UTC daily.
    - cron: '0 15 * * *'
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'server-go/cmd/server/**'
      - 'server-go/internal/k8s/**'
      - 'server-go/internal/storagebudget/**'
      - 'server-go/internal/config/**'
      - 'server-go/internal/wiring/**'
      - 'charts/provisioning/**'
      - '.github/workflows/e2e-k3d.yml'

permissions:
  contents: read

jobs:
  k3d-smoke:
    name: k3d control-plane smoke
    # Hosted 2-core/7GB runner. Safe for this scoped smoke (one Postgres + the
    # provisioning pod, no CNPG/ingress/cert-manager). If the scope ever grows
    # to the full multi-tenant stack, move this to a self-hosted label instead.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      K3D_VERSION: v5.7.4
      CLUSTER: excalibase
      NS: excalibase-platform
      IMAGE: excalibase/provisioning:ci
    steps:
      - uses: actions/checkout@v4

      - name: Build provisioning image
        run: docker build -t "$IMAGE" -f server-go/Dockerfile server-go

      - name: Install k3d
        run: curl -sSfL https://raw.githubusercontent.com/k3d-io/k3d/${K3D_VERSION}/install.sh | TAG=${K3D_VERSION} bash

      - name: Create cluster
        run: k3d cluster create "$CLUSTER" --agents 1 --wait --timeout 180s

      - name: Import image into cluster
        run: k3d image import "$IMAGE" -c "$CLUSTER"

      - name: Deploy platform Postgres store
        run: |
          kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -
          # The provisioning chart's NetworkPolicy admits and reaches the platform namespace by this label.
          kubectl label namespace "$NS" excalibase.io/type=platform --overwrite
          kubectl apply -n "$NS" -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: platform-db
            labels: { app: platform-db }
          spec:
            replicas: 1
            selector:
              matchLabels: { app: platform-db }
            template:
              metadata:
                labels: { app: platform-db }
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    env:
                      - { name: POSTGRES_USER, value: platform }
                      - { name: POSTGRES_PASSWORD, value: platform }
                      - { name: POSTGRES_DB, value: platform }
                    ports:
                      - containerPort: 5432
                    readinessProbe:
                      exec:
                        command: ["pg_isready", "-U", "platform"]
                      initialDelaySeconds: 5
                      periodSeconds: 5
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: platform-db
          spec:
            selector: { app: platform-db }
            ports:
              - port: 5432
                targetPort: 5432
          EOF
          kubectl -n "$NS" rollout status deploy/platform-db --timeout=180s

      - name: Production storage setup with MySQL off (CNPG, a sized class, a project namespace)
        run: |
          # The budget lists each project's CNPG clusters, so their CRD must exist.
          kubectl apply --server-side --force-conflicts \
            -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v1.30.1/releases/cnpg-1.30.1.yaml
          kubectl apply -f - <<'EOF'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: tenant-sized
          provisioner: rancher.io/local-path
          allowVolumeExpansion: true
          volumeBindingMode: WaitForFirstConsumer
          ---
          apiVersion: v1
          kind: Namespace
          metadata:
            name: org-smoke-proj
            labels:
              excalibase.io/type: project
          EOF
          # MySQL is off: neither MOCO nor its CRD is installed here.
          if kubectl get crd mysqlclusters.moco.cybozu.com >/dev/null 2>&1; then
            echo "MOCO must not be installed for this check"; exit 1
          fi

      - name: Chart requires the Studio URL
        run: sh charts/provisioning/tests/studio-url.sh

      - name: Chart serves the edge on its own listener
        run: sh charts/provisioning/tests/public-listener.sh

      - name: Chart lets provisioning check a volume can grow
        run: sh charts/provisioning/tests/disk-resize-rbac.sh

      - name: Chart requires the first-admin setup token
        run: sh charts/provisioning/tests/setup-token.sh

      - name: First-admin setup token Secret
        run: |
          kubectl -n "$NS" create secret generic first-admin-token --from-literal=token="$(openssl rand -hex 32)"

      - name: Install provisioning chart (Helm)
        run: |
          helm upgrade --install provisioning charts/provisioning \
            --namespace "$NS" --create-namespace \
            --set image.repository=excalibase/provisioning \
            --set image.tag=ci \
            --set image.pullPolicy=IfNotPresent \
            --set ingress.enabled=false \
            --set studioUrl=https://studio.excalibase.test \
            --set trustedProxyCIDRs=10.42.0.0/16 \
            --set setupToken.existingSecret=first-admin-token \
            --set-string env.FEATURE_MCP=true \
            --set-string env.FEATURE_PIPELINE=true \
            --set-string env.MYSQL_ENABLED=false \
            --set-string env.TENANT_STORAGE_REQUIRE_SIZED=true \
            --set-string env.TENANT_STORAGE_CLASS=tenant-sized \
            --set-string env.TENANT_SIZED_PROVISIONERS=rancher.io/local-path \
            --set-string env.STORAGE_NODE_CAPACITY=20Gi \
            --set-string env.APP_DISK_TOOLS_IMAGE='busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e' \
            --set-string platformDB.url='postgres://platform:platform@platform-db.excalibase-platform:5432/platform?sslmode=disable'

      - name: Wait for provisioning rollout
        run: |
          if ! kubectl -n "$NS" rollout status deploy/provisioning --timeout=180s; then
            kubectl -n "$NS" logs deploy/provisioning --tail=80 || true
            exit 1
          fi

      - name: Assert /healthz
        run: |
          kubectl -n "$NS" port-forward svc/provisioning 24005:24005 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:24005/healthz | grep -q ok; then
              echo "healthz OK"
              exit 0
            fi
            sleep 5
          done
          echo "healthz did not return ok within timeout"
          exit 1

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NS" get all || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs deploy/provisioning --tail=200 || true

      - name: Tear down cluster
        if: always()
        run: k3d cluster delete "$CLUSTER" || true
