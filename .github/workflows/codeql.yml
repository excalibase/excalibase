name: CodeQL

# GitHub's semantic code analysis (SAST). Runs on the same branches CI covers,
# on PRs into main, and on a weekly schedule so the DB stays fresh even on quiet
# weeks. Results land in the repo Security → Code scanning tab.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 04:00 UTC.
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
