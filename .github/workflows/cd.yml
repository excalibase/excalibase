name: Continuous Deployment

# Build & push the provisioning + studio images after CI passes on main.
# Trunk only: every commit gets main-<sha>. Release tags — 1.0.0, 1.0, 1,
# latest — are applied by release.yml, which retags a digest a green nightly
# installed. Building on a version tag would produce different bits from the
# ones that were tested, so this never runs on tags.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  DOCKER_IMAGE: excalibase/provisioning

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    # On workflow_run, only when CI succeeded. On tag push, always.
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      # Built into the local daemon and scanned before anything is pushed
      # (EXC-642); the push below is served from this build's cache.
      - name: Build the candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server-go
          file: server-go/Dockerfile
          load: true
          push: false
          tags: provisioning-candidate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy
        uses: ./.github/actions/trivy
        with:
          image: provisioning-candidate:${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # The provisioning binary + bundled watcher chart live under server-go/.
          context: server-go
          file: server-go/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  studio:
    name: Build & Push Studio Image
    runs-on: ubuntu-24.04
    # Same gate as provisioning: after CI on main, or on any version tag.
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: excalibase/studio
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      # Built into the local daemon and scanned before anything is pushed
      # (EXC-642); the push below is served from this build's cache.
      - name: Build the candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          file: frontend/Dockerfile
          load: true
          push: false
          tags: studio-candidate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy
        uses: ./.github/actions/trivy
        with:
          image: studio-candidate:${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # Studio is the Vite SPA under frontend/, served by nginx.
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deno-runtime:
    name: Build & Push Deno Runtime Image
    runs-on: ubuntu-24.04
    # Same gate as provisioning: after CI on main, or on any version tag.
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: excalibase/deno-runtime
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      # Built into the local daemon and scanned before anything is pushed
      # (EXC-642); the push below is served from this build's cache.
      - name: Build the candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: deno-server
          file: deno-server/Dockerfile
          load: true
          push: false
          tags: deno-runtime-candidate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy
        uses: ./.github/actions/trivy
        with:
          image: deno-runtime-candidate:${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # Per-project edge-function runtime. Builds the vendored
          # @excalibase/server lib (deno-server/lib/) inside the image, so the
          # context is deno-server/ alone — no sibling checkout needed.
          context: deno-server
          file: deno-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
