# Studio SPA served by nginx; /api proxied to the provisioning backend so the
# browser talks to one origin (auth cookie is same-site) in the all-in-one stack.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API -> provisioning backend. The resolver placeholder is replaced at
    # container start (docker-entrypoint.d/10-resolver.sh) with the nameserver
    # from /etc/resolv.conf, so this works under Docker's embedded DNS
    # (127.0.0.11) and Kubernetes cluster DNS alike. The variable upstream
    # forces re-resolution so a backend restart does not leave nginx with a
    # stale IP.
    location /api/ {
        resolver __DNS_RESOLVER__ valid=10s ipv6=off;
        set $backend "http://provisioning:24005";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
